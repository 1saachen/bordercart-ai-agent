[project]
name = "bordercart-ai-agent"
version = "0.1.0"
description = "BorderCart AI 跨境电商多 Agent：商品 RAG、KnowledgeBase 与交易确认"
readme = "README.md"
# AgentScope 2.x 要求 Python >= 3.11
requires-python = ">=3.11,<3.14"
dependencies = [
    "ag-ui-protocol==0.1.22",
    "agentscope==2.0.8",
    "aiosqlite>=0.22.1",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "pyjwt==2.13.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]

# 声明为独立 workspace root，避免 uv 向上探测课程仓库根部的 pyproject
[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "websockets>=16.1.1",
]
