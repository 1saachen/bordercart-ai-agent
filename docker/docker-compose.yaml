services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATA_DIR: /app/data
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - app-data:/app/data
    depends_on:
      - qdrant
    command: ["python", "-m", "uvicorn", "app.presentation.server:app", "--host", "0.0.0.0", "--port", "8000"]

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - app

volumes:
  app-data:
  qdrant-data:
